# server.properties - Pywer server settings
#
# One 'key=value' per line. '#' starts a comment. Values are case sensitive, keys are not.
# Delete a line to fall back to the default shown here.

# UDP port the server listens on.
server-port=19132

# Address to bind to (0.0.0.0 = every interface).
server-ip=0.0.0.0

# Server name shown in the client's server list.
motd=§epywer-v0.9.1dev

# Players allowed at the same time.
max-players=8

# 0 = survival, 1 = creative.
gamemode=0

# World seed, used until a world has been saved to world_data/.
level-seed=1337

# Chunk radius streamed around each player.
view-distance=4

# Fallback spawn X, only used when terrain generation is off.
spawn-x=0

# Fallback spawn Y, only used when terrain generation is off.
spawn-y=100

# Fallback spawn Z, only used when terrain generation is off.
spawn-z=0
